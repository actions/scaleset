name: Go
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # This will make sure we only apply the concurrency limits on pull requests
  # but not pushes to master branch by making the concurrency group name unique
  # for pushes
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    # Upstream jobs only run in actions/scaleset; in this fork the label is internal so the trusted policy accepts the file.
    if: github.repository == 'actions/scaleset'
    runs-on: arc-runner-ci-dispatcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false
      - name: fmt
        run: go fmt ./...
      - name: Check diff
        run: git diff --exit-code

  mocks:
    # Upstream jobs only run in actions/scaleset; in this fork the label is internal so the trusted policy accepts the file.
    if: github.repository == 'actions/scaleset'
    runs-on: arc-runner-ci-dispatcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false
      - name: "Run mockery"
        run: go tool github.com/vektra/mockery/v3
      - name: Check diff
        run: git diff --exit-code

  lint:
    # Upstream jobs only run in actions/scaleset; in this fork the label is internal so the trusted policy accepts the file.
    if: github.repository == 'actions/scaleset'
    runs-on: arc-runner-ci-dispatcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false
      - name: "Lint"
        run: go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run ./...

  test:
    # Upstream jobs only run in actions/scaleset; in this fork the label is internal so the trusted policy accepts the file.
    if: github.repository == 'actions/scaleset'
    runs-on: arc-runner-ci-dispatcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run tests
        run: go test ./... -race
